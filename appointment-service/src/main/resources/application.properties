
spring.application.name=appointment-service
server.port=8084

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/healthflow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.table=flyway_appointment_schema_history
spring.flyway.baseline-on-migrate=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

services.patient.url=${PATIENT_SERVICE_URL:http://localhost:8082}
services.doctor.url=${DOCTOR_SERVICE_URL:http://localhost:8083}